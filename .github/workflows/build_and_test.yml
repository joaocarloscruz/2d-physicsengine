name: Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build and tests
    strategy:
      # Retain evidence from both compiler/math-library implementations.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure native build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build native targets
        run: cmake --build build --config Release --parallel

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify installed package with external consumer
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/physics-install"
          cmake -S tests/package_consumer -B build-consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/physics-install"
          cmake --build build-consumer --config Release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PATH="$RUNNER_TEMP/physics-install/bin:$PATH"
            build-consumer/Release/consumer.exe
          else
            build-consumer/consumer
          fi

      - name: Publish fast numerical validation
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path('build/Testing/Temporary/LastTest.log')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Native test outcome\n\n')
              if log.exists():
                  lines = [line for line in log.read_text(encoding='utf-8', errors='replace').splitlines()
                           if line.startswith(('test cases:', 'assertions:', 'All tests passed'))]
                  summary.write('```text\n' + '\n'.join(lines) + '\n```\n\n' if lines else
                                'No Catch2 result summary was produced; inspect the test logs.\n\n')
                  if any('failed as expected' in line for line in lines):
                      summary.write('Expected failures are unresolved physical targets, not validated behavior. '
                                    'See [WCSPH consistency and hydrostatic work](https://github.com/joaocarloscruz/2d-physicsengine/issues/44).\n\n')
              else:
                  summary.write('Native tests did not produce a CTest log.\n\n')
          PY
          if [[ -f build/numerical-validation-fast.json ]]; then
            echo '## Fast numerical validation' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat build/numerical-validation-fast.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  visualizer:
    name: Visualizer build and setup validation
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # SFML 3.1.0; pin the source rather than accepting a moving tag.
      SFML_COMMIT: 8835b6b955c96fa1ad1278a8dae6f05c4143effc

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check setup command routing and failures
        shell: pwsh
        run: ./tests/visualizer_setup_tests.ps1

      - name: Install Linux graphics build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libfreetype-dev libharfbuzz-dev xvfb xauth fonts-dejavu-core

      - name: Fetch pinned SFML source
        shell: pwsh
        run: |
          git init "$env:RUNNER_TEMP/SFML"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/SFML" remote add origin https://github.com/SFML/SFML.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/SFML" fetch --depth 1 origin $env:SFML_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/SFML" checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and install local packages
        shell: pwsh
        run: |
          cmake -S "$env:RUNNER_TEMP/SFML" -B "$env:RUNNER_TEMP/sfml-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSFML_BUILD_AUDIO=OFF -DSFML_BUILD_NETWORK=OFF -DSFML_BUILD_EXAMPLES=OFF -DSFML_BUILD_TEST_SUITE=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/sfml-build" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install "$env:RUNNER_TEMP/sfml-build" --config Release --prefix "$env:RUNNER_TEMP/sfml-install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B "$env:RUNNER_TEMP/engine-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPHYSICS_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/engine-build" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install "$env:RUNNER_TEMP/engine-build" --config Release --prefix "$env:RUNNER_TEMP/physics-install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build visualizer from outside the repository
        shell: pwsh
        run: |
          $setupScript = Join-Path $env:GITHUB_WORKSPACE 'visualization/setup-and-build.ps1'
          Set-Location $env:RUNNER_TEMP
          & $setupScript -SFMLPrefix "$env:RUNNER_TEMP/sfml-install" -EnginePrefix "$env:RUNNER_TEMP/physics-install" -BuildDirectory "$env:RUNNER_TEMP/visualizer build" -Parallel 2

      - name: Render five hidden frames under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 30s xvfb-run -a -s '-screen 0 1280x720x24' "$RUNNER_TEMP/visualizer build/PhysicsVisualization" --smoke-test "$RUNNER_TEMP/capture.png"
          python3 - "$RUNNER_TEMP/capture.png" <<'PY'
          import struct
          import sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Missing PNG signature'
          assert struct.unpack('>II', data[16:24]) == (1280, 720), 'Unexpected render dimensions'
          assert len(data) > 1024, 'Empty render capture'
          PY

  webassembly:
    name: WebAssembly (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [optimized, sanitized, production]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EMSCRIPTEN_VERSION: 6.0.3
      WASM_PROFILE: ${{ matrix.profile }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git clone --filter=blob:none --branch "$EMSCRIPTEN_VERSION" --depth 1 \
            https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"

      - name: Configure WebAssembly build
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          args=(-DCMAKE_BUILD_TYPE=Release -DPHYSICS_WASM_BOUNDARY_TEST_PROBES=ON)
          if [[ "$WASM_PROFILE" == sanitized ]]; then
            args=(-DCMAKE_BUILD_TYPE=Debug -DPHYSICS_WASM_BOUNDARY_TEST_PROBES=ON
                  '-DCMAKE_CXX_FLAGS=-O1 -fsanitize=address,undefined -fno-omit-frame-pointer'
                  '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined -g')
          elif [[ "$WASM_PROFILE" == production ]]; then
            args=(-DCMAKE_BUILD_TYPE=Release -DPHYSICS_WASM_BOUNDARY_TEST_PROBES=OFF)
          fi
          emcmake cmake -S . -B build-wasm -DBUILD_TESTING=OFF -DPHYSICS_BUILD_EXAMPLES=OFF "${args[@]}"

      - name: Build WebAssembly target
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build build-wasm --target physics_engine_wasm --parallel 2

      - name: Run WebAssembly smoke test
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          node build-wasm/wasm/smoke-test.cjs
          if [[ "$WASM_PROFILE" == production ]]; then
            node - <<'JS'
          const assert = require('node:assert/strict');
          require('./build-wasm/wasm/physics_engine.js')().then(module => {
            const helpers = Object.keys(module).filter(name =>
              /boundaryTest|BoundaryTest|emscripten_stack_get_current/.test(name));
            assert.deepEqual(helpers, [], 'Production module exposes test helpers');
          }).catch(error => { console.error(error); process.exitCode = 1; });
          JS
          else
            node build-wasm/wasm/boundary-stress.cjs
          fi

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test with sanitizers
        run: |
          cmake --build build-sanitized --parallel 2
          ctest --test-dir build-sanitized --output-on-failure
